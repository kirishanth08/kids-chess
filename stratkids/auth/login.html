<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Parent Portal Login | StratKids Summer Camp</title>
  <meta name="description" content="Access the StratKids Parent Portal to track your child's daily schedule, skill progression, camp photos, and direct coach messages.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- StratKids Custom Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <script>
    (function(){
      const t = localStorage.getItem('stratkids_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark');
      document.documentElement.setAttribute('data-bs-theme', t);
      const d = localStorage.getItem('stratkids_direction') || 'ltr';
      document.documentElement.setAttribute('dir', d);
    })();
  </script>
</head>
<body style="background: #0E151A;">

  <!-- ==========================================================================
       TOP UTILITY CONTROLS (Floating Theme & Language Switches)
       ========================================================================== -->
  <header class="position-absolute top-0 end-0 p-3 p-md-4" style="z-index: 100;">
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="tool-toggle-btn theme-toggle-btn" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
        <i class="bi bi-moon-stars"></i>
      </button>
      <button type="button" class="tool-toggle-btn rtl-toggle-btn" aria-label="Toggle text direction" title="Toggle RTL/LTR">
        <i class="bi bi-arrow-left-right"></i>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       SECTION 2: CENTERED PORTAL AUTH CARD
       ========================================================================== -->
  <main class="portal-auth-wrapper">
    <div class="portal-auth-card">
      
      <!-- Top Branding in Card Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center gap-3 text-decoration-none mb-3">
          <img src="../assets/icons/favicon.svg" alt="StratKids Logo" height="48" width="48" class="rounded-3 shadow-sm">
          <div class="brand-text text-start">
            <span class="brand-title" style="font-size: 1.85rem; color: #FFFFFF !important;">Strat<span style="color: #FF6B8B !important;">Kids</span></span>
            <span class="brand-tagline" style="font-size: 0.72rem; color: #7FE5F5 !important; letter-spacing: 1.5px;">Think. Play. Grow.</span>
          </div>
        </div>

        <h1 class="h4 fw-bold text-white mb-2" style="font-family: var(--sk-font-heading); letter-spacing: 0.5px;">
          WELCOME BACK TO YOUR STRATKIDS PORTAL
        </h1>
        <p class="text-white-50 small mb-0">
          Your camper information, schedules, and progress in one place.
        </p>
      </div>

      <!-- Quick Social / Federated Sign-in Buttons -->
      <div class="d-flex flex-column gap-2 mb-3">
        <button type="button" class="btn btn-portal-social w-100 d-flex align-items-center justify-content-center gap-2" id="socialGoogleBtn">
          <!-- Google G Logo SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <button type="button" class="btn btn-portal-social w-100 d-flex align-items-center justify-content-center gap-2" id="socialAppleBtn">
          <i class="bi bi-apple fs-5"></i>
          <span>Sign in with Apple</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="portal-divider my-4">
        <span>OR CONTINUE WITH EMAIL</span>
      </div>

      <!-- Alert placeholder -->
      <div id="loginAlert"></div>

      <!-- Main Login Form -->
      <form id="stratkidsLoginForm" novalidate>
        <div class="mb-3">
          <label class="form-label text-white-50 small fw-semibold mb-1" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control portal-input" value="sarah.vance@example.com" placeholder="alex.morgan@example.com" required autocomplete="email">
          <div class="invalid-feedback text-danger small">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label text-white-50 small fw-semibold mb-0" for="loginPassword">Password</label>
            <a href="forgot-password.html" class="portal-link-accent">Forgot Password?</a>
          </div>
          <div class="position-relative">
            <input type="password" id="loginPassword" class="form-control portal-input pe-5" value="StratKids2026!" placeholder="••••••••••••" required autocomplete="current-password">
            <button class="btn border-0 position-absolute end-0 top-50 translate-middle-y text-white-50 password-toggle-btn" type="button" aria-label="Toggle password visibility">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
          <div class="invalid-feedback text-danger small">Please enter your password.</div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input portal-checkbox" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-white-50" for="rememberMe">
            Remember me on this browser
          </label>
        </div>

        <button type="submit" class="btn btn-portal-submit w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-lock-fill"></i> Sign In to My StratKids
        </button>

        <div class="text-center mt-4 pt-1">
          <p class="small text-white-50 mb-1">Don't have a portal account yet?</p>
          <a href="register.html" class="portal-link-accent fw-bold text-decoration-none">
            Create Parent Account
          </a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script>
    // Quick Demo Social Sign-in Handlers
    document.getElementById('socialGoogleBtn')?.addEventListener('click', () => {
      const alert = document.getElementById('loginAlert');
      if (alert) {
        alert.innerHTML = `
          <div class="alert alert-success alert-dismissible fade show p-3 small mb-3 rounded-4 d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill text-success fs-4 flex-shrink-0"></i>
            <div class="flex-grow-1">
              <strong>Login Successful!</strong><br>
              <span>Successfully authenticated via Google. Welcome back!</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
        alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    document.getElementById('socialAppleBtn')?.addEventListener('click', () => {
      const alert = document.getElementById('loginAlert');
      if (alert) {
        alert.innerHTML = `
          <div class="alert alert-success alert-dismissible fade show p-3 small mb-3 rounded-4 d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill text-success fs-4 flex-shrink-0"></i>
            <div class="flex-grow-1">
              <strong>Login Successful!</strong><br>
              <span>Successfully authenticated via Apple ID. Welcome back!</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
        alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  </script>
</body>
</html>
