<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- StratKids Strategic Chess Rook Mark -->
  <g transform="translate(6, 4)">
    <!-- Base Board Square -->
    <rect x="0" y="4" width="48" height="48" rx="14" fill="#CA6180"/>
    <rect x="2" y="6" width="44" height="44" rx="12" stroke="#9ED3DC" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Rook Battlements -->
    <path d="M14 18 H18 V22 H21 V18 H27 V22 H30 V18 H34 V24 H14 Z" fill="#FFFFFF"/>
    <!-- Rook Collar -->
    <path d="M16 24 H32 L30 29 H18 Z" fill="#FFFFFF"/>
    <!-- Rook Body -->
    <path d="M18 29 H30 L29 38 H19 Z" fill="#FFFFFF"/>
    <!-- Rook Base -->
    <path d="M16 38 H32 V40 H16 Z" fill="#FEFD99"/>
    <path d="M13 40 H35 V44 C35 44.8 34.2 45.5 33.5 45.5 H14.5 C13.8 45.5 13 44.8 13 44 Z" fill="#FFFFFF"/>
    <!-- Star on Chest -->
    <circle cx="24" cy="33.5" r="2" fill="#CA6180"/>
  </g>

  <!-- Typography: StratKids -->
  <text x="68" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#26333A" letter-spacing="-0.5">
    Strat<tspan fill="#CA6180">Kids</tspan>
  </text>
  
  <!-- Brand Tagline: Think. Play. Grow. -->
  <text x="70" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#CA6180" letter-spacing="2">
    THINK. PLAY. GROW.
  </text>
  
  <!-- Mini Strategy Star Sparkle -->
  <circle cx="258" cy="22" r="3" fill="#FEFD99"/>
  <path d="M258 16 L258 28 M252 22 L264 22" stroke="#CA6180" stroke-width="1.5" stroke-linecap="round"/>
</svg>
